baselines:
  capability_check: true
  prompt_dont_cheat: true
  random_vector: true
concepts:
  controls:
  - compliance
  cosine_only:
  - conscientiousness
  mechanisms:
  - tedium
  - eval_aware
  - disapproval
  - desperate
  - shortcut
  - completion_drive
env:
  max_turns: 80
  n_type_errors_default: 258
  n_type_errors_easy: 20
  name: precommit_hook
  source: https://github.com/gkroiz/agent-interp-envs
infra:
  azure_location: eastus
  azure_rg: IncidentFox
  budget_usd_cap: 600
  checkpoint_every_rollouts: 5
  confirm_before:
  - a100_payg
  - third_parallel_gpu
  - remaining_budget_under_run_estimate
  - credits_unconfirmed_at_usd_30
  eviction_policy: Deallocate
  gpu_cloud: azure_vm
  kill_after_hours: 8
  main_sku: Standard_NC24ads_A100_v4
  max_parallel_gpus: 2
  prefer_spot: true
  recon_sku: Standard_NC24ads_A100_v4
judge:
  labels:
  - shortcut_score
  - is_shortcut
  - workaround_type
  - verbalized_eval_aware
  - verbalized_disapproval
  - verbalized_tedium
  - verbalized_desperate
  - verbalized_completion_drive
  - capability_ok
  max_tokens: 400
  n_human_spotcheck: 30
  route: azure_openai
  temperature: 0
mats:
  counted:
  - env adaptation and experiment code
  - choosing contrasts / reading transcripts
  - analysis and writeup
  - actively iterating on failed runs
  extra_writeup_hours: 2
  max_hours: 20
  not_counted:
  - general paper reading before picking this project
  - GPU VM bring-up / driver / venv
  - cloning agent-interp-envs
  - waiting on training/generation while doing something else
model:
  dtype: bfloat16
  enable_thinking: true
  fallback: Qwen/Qwen2.5-14B-Instruct
  layer_frac_hi: 0.75
  layer_frac_lo: 0.6
  main: Qwen/Qwen3.6-27B
  max_new_tokens: 4096
  recon: Qwen/Qwen3.5-9B
  temperature: 0.7
n:
  contrast_train: 80
  contrast_val: 20
  min_shortcuts: 20
  natural_rollouts: 100
  readout_tokens: decision
  recon_min_shortcut_rate: 0.08
  recon_rollouts: 40
  steer_per_condition: 30
project: shortcut_forensics
run_id: null
steer:
  ablate_concepts:
  - tedium
  - desperate
  - shortcut
  - completion_drive
  - eval_aware
  ablate_random: true
  add_neg_winner: true
  add_pos_concepts:
  - disapproval
  - eval_aware
  alpha: 1.0
  apply_to: original_prompt
  identity: true
  layers: auto
  prompt_dont_cheat: true
